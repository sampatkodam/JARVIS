name: JARVIS Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run tests and capture diagnostics
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
